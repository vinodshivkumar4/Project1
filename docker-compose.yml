version: "3.8"

services:
  nodeapp:
    build: ./app

    container_name: nodejs_app

    restart: always

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5